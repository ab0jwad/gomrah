name: keep-database-awake
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (guest_status)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o out.txt -w "%{http_code}" -m 30 -X POST \
              "https://rhjpblazeuksqzlhdomn.supabase.co/rest/v1/rpc/guest_status" \
              -H "apikey: sb_publishable_aXvh7LsChsFkF_7cirPDpA_cUMgtYWs" \
              -H "Content-Type: application/json" -d '{}')
            echo "attempt $i: HTTP $code $(cat out.txt)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
