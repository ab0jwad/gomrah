<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5a0a0e">
<base href="../">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest-dev.json">
<meta name="apple-mobile-web-app-title" content="فحص النظام">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>فحص النظام — غمرة دانة</title>
<style>
:root{--burg:#58060a;--gold:#c9a36e;--cream:#f6eede;--ink:#2b1a14;--muted:#8a7360;--ok:#1f8a4c;--warn:#9a5b00;--bad:#b3261e;--line:#e3d5bb;--card:#fffdf8}
*{box-sizing:border-box}
html{color-scheme:light}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif}
main{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
h1{font-size:24px;color:var(--burg);margin:6px 0 2px;text-align:center}
.sub{text-align:center;color:var(--muted);font-size:14px;margin:0}
.sum{margin:16px 0 4px;padding:14px;border-radius:14px;text-align:center;font-size:18px;font-weight:700}
.sum.ok{background:#e6f2ea;color:var(--ok)}.sum.warn{background:#fff4e0;color:var(--warn)}.sum.bad{background:#fde8e6;color:var(--bad)}.sum.run{background:#eee;color:#555}
h2{font-size:16px;color:var(--burg);margin:20px 0 8px}
.row{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;margin-top:1px}
.dot.ok{background:var(--ok)}.dot.warn{background:#d98a00}.dot.bad{background:var(--bad)}.dot.run{background:#bbb}
.row b{display:block;font-size:15px}.row span{display:block;font-size:13px;color:var(--muted);line-height:1.7;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.st b{display:block;font-size:22px;color:var(--burg);font-variant-numeric:tabular-nums}.st span{font-size:12px;color:var(--muted)}
input{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:12px;border:2px solid var(--line);background:#fff;text-align:center;letter-spacing:5px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-size:17px;font-weight:700;background:var(--burg);color:#fff;cursor:pointer;margin-top:8px}
.btn.sec{background:#fff;color:var(--burg);border:2px solid var(--burg)}
.note{font-size:13px;color:var(--muted);line-height:1.8}
</style>
</head>
<body>
<main>
  <h1>فحص النظام</h1>
  <p class="sub">غمرة دانة — كل الفحوص قراءة فقط ولا تغيّر أي بيانات</p>
  <div class="sum run" id="sum">جارٍ الفحص…</div>
  <button class="btn" id="again">إعادة الفحص</button>

  <h2>الروابط والصفحات</h2><div id="g1"></div>
  <h2>قاعدة البيانات والحماية</h2><div id="g2"></div>
  <h2>منع توقف قاعدة البيانات</h2><div id="g3"></div>

  <h2>الأرقام والإعدادات (بالرقم السري لأم العروسة)</h2>
  <div id="pinWrap">
    <input id="pin" inputmode="numeric" maxlength="8" placeholder="••••••" dir="ltr">
    <button class="btn sec" id="pinBtn">عرض</button>
  </div>
  <div id="g4"></div>
  <div class="grid" id="nums" hidden></div>
  <p class="note" id="when"></p>
</main>
<script>
const API='https://rhjpblazeuksqzlhdomn.supabase.co/rest/v1/rpc/', KEY='sb_publishable_aXvh7LsChsFkF_7cirPDpA_cUMgtYWs';
const SITE='https://ab0jwad.github.io/gomrah/';
const EVENT_AT=new Date('2026-11-28T21:00:00+03:00').getTime();
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function rpc(fn,body){const r=await fetch(API+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||('http '+r.status));return j}
const results=[];
function row(g,state,title,detail){results.push(state);$(g).insertAdjacentHTML('beforeend',`<div class="row"><div class="dot ${state}">${state==='ok'?'✓':state==='warn'?'!':'✕'}</div><div><b>${esc(title)}</b>${detail?'<span>'+esc(detail)+'</span>':''}</div></div>`)}
async function timed(f){const t=performance.now();const v=await f();return [v,Math.round(performance.now()-t)]}
const ago=d=>{const m=Math.round((Date.now()-new Date(d))/60000);return m<60?m+' دقيقة':Math.floor(m/60)+' ساعة و'+(m%60)+' دقيقة'};
async function page(path,name,mustHave){try{const r=await fetch(SITE+path+(path.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'});
  if(!r.ok)return row('g1','bad',name,'لا تفتح (رمز '+r.status+')');
  if(mustHave){const t=await r.text();if(!t.includes(mustHave))return row('g1','bad',name,'تفتح لكن محتواها ناقص')}
  row('g1','ok',name,SITE+path)}catch(e){row('g1','bad',name,'تعذّر الاتصال')}}
async function file(path,name){try{const r=await fetch(SITE+path+'?v='+Date.now(),{method:'HEAD',cache:'no-store'});row('g1',r.ok?'ok':'bad',name,r.ok?'موجود':'غير موجود ('+r.status+')')}catch(e){row('g1','bad',name,'تعذّر الاتصال')}}
async function run(){results.length=0;['g1','g2','g3','g4'].forEach(g=>$(g).innerHTML='');$('sum').className='sum run';$('sum').textContent='جارٍ الفحص…';$('again').disabled=true;
  await Promise.all([
    page('','صفحة الضيوف (الرابط العام)','gListNote'),
    page('um/','صفحة أم العروسة','admin_link_create2'),
    page('door/','صفحة فحص الدخول (الموظفة)','staff_checkin'),
    page('bride/','صفحة دعوات العروسة','bride_link_create'),
    file('invite.jpg','صورة البطاقة'),file('music.mp3','الموسيقى'),file('og.jpg','صورة معاينة الرابط في الواتساب')]);
  // database
  try{const [r,ms]=await timed(()=>rpc('guest_status',{}));row('g2',ms>4000?'warn':'ok','قاعدة البيانات تعمل','زمن الاستجابة '+ms+' ملّي ثانية'+(r.full?' — العدد مكتمل':''))}
  catch(e){row('g2','bad','قاعدة البيانات لا تستجيب','الضيوف سيرون «تعذّر الاتصال». '+e.message)}
  const dev='devcheck-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
  try{const g=await rpc('guest_gate',{p_token:null,p_device:dev});
    row('g2',g.open?'ok':'bad','الرابط العام يفتح للضيوف',g.open?(g.list?'يُطلب رقم الجوال، ولا يؤكد إلا من رقمها في قائمة المدعوات':'تظهر خانة الاسم والجوال للضيف'):'مقفول')}
  catch(e){row('g2','bad','الرابط العام','تعذّر الفحص')}
  try{const g=await rpc('guest_gate',{p_token:'ZZZZZZZ',p_device:dev});row('g2',(g.open&&!g.only)||(!g.open&&g.why==='bad_link')?'ok':'bad','رابط برمز قديم أو مزيّف',g.open?'يفتح كالرابط العام (لا يُقفل على الضيف)':'يُرفض')}
  catch(e){row('g2','bad','الرابط المزيّف','تعذّر الفحص')}
  // keep-alive
  try{const r=await fetch('https://api.github.com/repos/ab0jwad/gomrah/actions/workflows/keepalive.yml/runs?per_page=5',{cache:'no-store'});const j=await r.json();
    const runs=(j.workflow_runs||[]);const last=runs[0];const lastOk=runs.find(x=>x.conclusion==='success');
    if(!last)row('g3','bad','تنبيه إبقاء قاعدة البيانات مستيقظة','لم يُعثر على أي تشغيل');
    else{const h=(Date.now()-new Date(lastOk?lastOk.updated_at:0))/3.6e6;
      row('g3',lastOk&&h<9?'ok':lastOk&&h<20?'warn':'bad','التنبيه الدوري (كل 6 ساعات)',lastOk?'آخر تشغيل ناجح قبل '+ago(lastOk.updated_at):'آخر تشغيلات فشلت')}}
  catch(e){row('g3','warn','التنبيه الدوري','تعذّر الوصول إلى GitHub للفحص الآن')}
  // admin
  await health();
  const bad=results.filter(x=>x==='bad').length,warn=results.filter(x=>x==='warn').length;
  $('sum').className='sum '+(bad?'bad':warn?'warn':'ok');$('sum').textContent=bad?bad+' مشكلة تحتاج مراجعة':warn?'يعمل، مع '+warn+' تنبيه':'كل شيء يعمل ✓';
  const d=Math.max(0,Math.ceil((EVENT_AT-Date.now())/864e5));
  $('when').textContent='آخر فحص: '+new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' — باقي على الغمرة '+d+' يوم';
  $('again').disabled=false}
async function health(){const PIN=ls.get('dev_pin');$('nums').hidden=true;if(!PIN){$('pinWrap').hidden=false;return}$('pinWrap').hidden=true;
  try{const h=await rpc('dev_health',{p_pin:PIN});
    row('g4',h.admin_pin_default?'warn':'ok','الرقم السري لأم العروسة',h.admin_pin_default?'ما زال الرقم الافتراضي 123456 — غيّريه من «المزيد» قبل المناسبة':'مُغيَّر عن الافتراضي');
    row('g4',h.staff_pin_default?'warn':'ok','الرقم السري للموظفة',h.staff_pin_default?'ما زال الافتراضي 654321 — غيّريه من «المزيد»':'مُغيَّر عن الافتراضي');
    row('g4',h.bride_pin_set?'ok':'warn','الرقم السري للعروسة',h.bride_pin_set?'موجود':'غير مضبوط');
    row('g4','ok','الدعوة الجماعية (الرابط العام)',!h.invite_only?'كل من يصله الرابط يسجّل ويأخذ بطاقته ويُضاف لقائمة المدعوين':h.general_open?'تصل طلبات وتحتاج موافقة أم العروسة — بانتظار الموافقة: '+h.requests_pending:'لا تؤكد إلا الأرقام المسجّلة في القائمة');
    row('g4',h.overbooked?'bad':'ok','العدد',h.overbooked?'المؤكدون أكثر من العدد المسموح!':'المؤكدون '+h.persons+' من '+h.capacity);
    if(h.fail_count>=5)row('g4','warn','محاولات رقم سري خاطئة',h.fail_count+' محاولة خلال آخر 10 دقائق');
    const N=[['persons','أشخاص مؤكدون'],['capacity','العدد المسموح'],['cards_taken','بطاقات مؤكدة'],['entered','دخلن'],['links_active','روابط خاصة فعّالة'],['links_used','روابط فُتحت'],['links_bride','من العروسة'],['list_invites','في قائمة الأرقام'],['requests_pending','طلبات بانتظار الموافقة'],['declines','اعتذرن']];
    $('nums').innerHTML=N.map(([k,t])=>`<div class="st"><b>${h[k]}</b><span>${t}</span></div>`).join('');$('nums').hidden=false}
  catch(e){if(/bad_pin|not_admin|locked/.test(e.message)){ls.del('dev_pin');$('pinWrap').hidden=false;row('g4','warn','الرقم السري',/locked/.test(e.message)?'محاولات كثيرة، انتظر 10 دقائق':'الرقم غير صحيح أو تغيّر')}else row('g4','bad','قراءة الأرقام','تعذّر الاتصال')}}
$('pinBtn').onclick=()=>{const p=$('pin').value.trim();if(!p)return;ls.set('dev_pin',p);$('pin').value='';run()};
$('again').onclick=run;run();
</script>
</body>
</html>
